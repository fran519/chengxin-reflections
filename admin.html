<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊完以後｜管理</title>
<style>body{font-family:"Noto Serif TC","PingFang TC",sans-serif;background:#fbf7ef;color:#34405b;max-width:900px;margin:auto;padding:30px}.box{background:#fff;border-radius:20px;padding:24px;margin:15px 0}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}button{border:0;border-radius:999px;padding:11px 20px;background:#34405b;color:white;margin:4px;cursor:pointer}.pending{border-top:1px solid #eee;padding:20px 0}.muted{color:#777}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><h1>聊完以後｜內容管理</h1><div class="box" id="login">
<p>管理員登入</p>
<input id="email" type="email" placeholder="管理員 Email">
<input id="password" type="password" placeholder="密碼">
<button onclick="login()">登入</button>
<p class="muted" id="msg"></p>
</div><div id="app" style="display:none"><button onclick="load()">重新整理</button><button onclick="logout()">登出</button><div id="list"></div></div>
<script>
const CONFIG={url:"https://bgqncjyqnimifoyamhge.supabase.co",key:"sb_publishable_qwpN_Jtd6_ZO8D6OLVxBOg_yzfzt2lg"};const db= supabase.createClient(CONFIG.url,CONFIG.key);
async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 document.getElementById("msg").textContent=error?error.message:"登入成功。";
 if(!error) init();
}
async function init(){const {data:{session}}=await db.auth.getSession();document.getElementById("login").style.display=session?"none":"block";document.getElementById("app").style.display=session?"block":"none";if(session)load()}
async function load(){const {data,error}=await db.from("reflections").select("*").order("created_at",{ascending:false});if(error){document.getElementById("list").innerHTML="<p>"+error.message+"</p>";return}document.getElementById("list").innerHTML=(data||[]).map(x=>`<div class="pending"><b>${esc(x.nickname||"匿名")}</b><div>${esc(x.feeling)}</div><small>${x.created_at||""}｜${x.status}</small><br>${x.status==="pending"?`<button onclick="publish('${x.id}')">確認公開</button>`:""} <button onclick="removeItem('${x.id}')">刪除</button></div>`).join("")||"<p>目前沒有內容。</p>"}
async function publish(id){await db.from("reflections").update({status:"published"}).eq("id",id);load()}
async function removeItem(id){if(confirm("確定刪除？")){await db.from("reflections").delete().eq("id",id);load()}}
async function logout(){await db.auth.signOut();init()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
init();
</script></body></html>
